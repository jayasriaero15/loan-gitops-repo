appName: frontend
version: v1
replicaCount: 2
image:
  repository: asia-south1-docker.pkg.dev/project-76f55662-b24c-481a-88e/spring-app-repo/frontend
  tag: "1.0.0"
containerPort: 8080
service:
  enabled: true
  type: LoadBalancer      # switch to ClusterIP when Istio Ingress Gateway is added
  port: 80
env: {}
probes:
  liveness:  { path: /healthz, initialDelaySeconds: 5, periodSeconds: 10 }
  readiness: { path: /healthz, initialDelaySeconds: 3, periodSeconds: 5 }
metrics:
  enabled: false
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 128Mi }
